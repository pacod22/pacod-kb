<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0fb39a"/>
      <stop offset="1" stop-color="#0c7c6b"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#ece2cb"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ece2cb"/>
      <stop offset="1" stop-color="#fbf6ea"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- soft inner shadow under book -->
  <ellipse cx="16" cy="24" rx="11" ry="2.2" fill="#064f44" opacity="0.35"/>

  <!-- left page -->
  <path d="M16 9.2 C12.6 7.2 8 7.2 4.8 8.7 L4.8 21.6 C8 20.1 12.6 20.1 16 22.2 Z"
        fill="url(#pageL)"/>
  <!-- right page -->
  <path d="M16 9.2 C19.4 7.2 24 7.2 27.2 8.7 L27.2 21.6 C24 20.1 19.4 20.1 16 22.2 Z"
        fill="url(#pageR)"/>

  <!-- page text lines (left) -->
  <g stroke="#0c7c6b" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
    <line x1="7" y1="11.6" x2="13.3" y2="12.4"/>
    <line x1="7" y1="14.3" x2="13.3" y2="15.1"/>
    <line x1="7" y1="17.0" x2="13.3" y2="17.8"/>
  </g>
  <!-- page text lines (right) -->
  <g stroke="#0c7c6b" stroke-width="1.1" stroke-linecap="round" opacity="0.55">
    <line x1="18.7" y1="12.4" x2="25" y2="11.6"/>
    <line x1="18.7" y1="15.1" x2="25" y2="14.3"/>
    <line x1="18.7" y1="17.8" x2="25" y2="17.0"/>
  </g>

  <!-- gold spine / bookmark -->
  <rect x="14.9" y="8.4" width="2.2" height="14.4" rx="1.1" fill="#e8b53a"/>
  <path d="M14.9 22 h2.2 v3.4 l-1.1 -1.3 -1.1 1.3 Z" fill="#d99e22"/>
</svg>
