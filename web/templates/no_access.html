<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No access — Knowledge Base</title>
  <link rel="icon" href="/kb/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/kb/static/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="/kb/static/style.css">
  <script>(function(){var t=localStorage.getItem('kb-theme')||'light';document.documentElement.setAttribute('data-bs-theme',t);})();</script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
    <div class="card-body p-4">
      <div class="d-flex align-items-center gap-2 mb-3">
        <img src="/kb/static/favicon.svg" alt="KB" width="32" height="32" class="rounded">
        <h1 class="h5 mb-0 fw-bold">Knowledge Base</h1>
      </div>
      <div class="alert alert-warning py-2 small" role="alert">
        You are signed in as <strong>{{ principal.email or principal.sub }}</strong>, but this account has no
        role in the knowledge base.
      </div>
      <p class="small text-muted">Ask a knowledge-base administrator to give you a role, then sign in again.</p>
      <form method="post" action="/kb/logout">
        <button class="btn btn-outline-secondary w-100" type="submit">Sign out</button>
      </form>
    </div>
  </div>
</body>
</html>
