{% set active = active_project or '' %}
<div id="sidebar-project-switcher" class="sidebar-project px-3 py-2 border-top border-bottom">
  <div class="sidebar-project-label">Active project</div>
  <div class="sidebar-project-active text-truncate" title="{{ active or 'none' }}">
    {{ active or 'none' }}
  </div>
  {% if user_can('editor') %}
  <form hx-post="/kb/pipeline/settings/project"
        hx-target="#sidebar-project-switcher"
        hx-swap="outerHTML"
        class="d-flex align-items-center gap-2 mt-2">
    <input type="hidden" name="sidebar" value="1">
    <select name="project" class="form-select form-select-sm sidebar-project-select">
      {% for p in sidebar_projects %}
      <option value="{{ p.slug }}" {% if p.slug == active %}selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
      {% if not sidebar_projects %}
      <option value="{{ active }}" selected>{{ active or '(none)' }}</option>
      {% endif %}
    </select>
    <button type="submit" class="btn btn-sm btn-outline-secondary">Set</button>
  </form>
  {% endif %}
  {% if error %}
  <div class="text-danger text-xs mt-1">{{ error }}</div>
  {% endif %}
</div>
