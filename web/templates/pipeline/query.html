{% extends "base.html" %}
{% block title %}Search{% endblock %}
{% block content %}
<header class="page-header">
  <div>
    <h1 class="page-title">Search</h1>
    <p class="page-subtitle">Hybrid semantic plus keyword retrieval across the active project scope.</p>
  </div>
</header>

<section class="section-card">
  <div class="sc-body">
    <form hx-post="/kb/pipeline/query"
          hx-target="#results"
          hx-swap="innerHTML"
          class="grid-form">
      <div class="field span-all">
        <label for="query-text">Query</label>
        <input type="text" id="query-text" name="query" value="{{ query or '' }}" placeholder="Enter query..." required>
      </div>
      <div class="field">
        <label for="query-top-k">Top K</label>
        <input type="number" id="query-top-k" name="top_k" value="5" min="1" max="20" title="Top K">
      </div>
      <div>
        <button type="submit" class="btn btn-primary">
          Search
          <span class="htmx-indicator spinner" aria-hidden="true"></span>
        </button>
      </div>
    </form>
  </div>
</section>

<div id="results">
{% include "pipeline/_query_results.html" %}
</div>
{% endblock %}
