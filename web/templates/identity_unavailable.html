{% extends "auth_base.html" %}
{% block title %}Unavailable{% endblock %}
{% block content %}
  {{ notice("bad", (reason ~ ".") | e) }}
  <p class="small muted">Who may do what is decided by pacod-id, and its answer cannot be checked
    right now. This page retries by itself.</p>
  <a class="btn btn-wide" href="{{ retry }}">Try again</a>
  <script>setTimeout(function(){ location.reload(); }, 10000);</script>
{% endblock %}
