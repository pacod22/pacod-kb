[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kb-pipeline"
version = "1.0.0"
description = "Document knowledge base for RAG: ingest, canonical Markdown, versioned hybrid search with a stable metadata contract"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Paco", email = "26955841+pacod22@users.noreply.github.com" }]
keywords = ["rag", "retrieval", "knowledge-base", "hybrid-search", "qdrant", "bge-m3"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.140",
    "pypandoc>=1.17",
    "mammoth>=1.13",
    "trafilatura>=2.3",
    "typer>=0.26",
    "pyyaml>=6.0",
    "jsonschema>=4.26",
    "python-dotenv>=1.2",
    "langdetect>=1.0",
    "qdrant-client>=1.19",
    "sentence-transformers>=6.1",
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "sqlalchemy>=2.1",
    "beautifulsoup4>=4.15",
    # Declared directly so [tool.uv.sources] can take them from PyTorch's CPU index on Linux.
    "torch>=2.14",
    "torchvision>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
kb = "pipeline.cli:app"

[dependency-groups]
# Tests import web.*, so dev carries the UI group too.
dev = [
    { include-group = "ui" },
    "pytest>=9.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-pyyaml>=6.0",
    "python-docx>=1.2",
    "fpdf2>=2.8",
    "types-jsonschema>=4.26.0.20260518",
    "pytest-cov>=7.1",
    "pip-audit>=2.10",
]
# Runtime dependencies of the web UI container only (Dockerfile.ui installs this
# group from uv.lock; the UI must not pull in docling/torch).
ui = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "qdrant-client>=1.19",
    "python-dotenv>=1.2",
    "sqlalchemy>=2.1",
    "markupsafe>=3.0",
    # Signs the session cookie (Starlette's SessionMiddleware).
    "itsdangerous>=2.2",
    # pacod-id's Python package (vendored wheel, see [tool.uv.sources]) and what the UI's
    # server-side sessions encrypt tokens with.
    "pacod-id",
    "cryptography>=50.0",
]

[project.urls]
Homepage = "https://github.com/pacod22/pacod-kb"
Documentation = "https://github.com/pacod22/pacod-kb/tree/main/docs"
Changelog = "https://github.com/pacod22/pacod-kb/blob/main/CHANGELOG.md"
Issues = "https://github.com/pacod22/pacod-kb/issues"

[tool.uv.sources]
# Built from a pacod-id checkout by scripts/vendor-pacod-id.sh; never resolved through an index.
pacod-id = { path = "vendor/wheels/pacod_id-0.1.0-py3-none-any.whl" }
# The pipeline runs on CPU: Linux gets PyTorch's CPU-only wheels (no nvidia-*/triton CUDA
# packages in the image). macOS wheels from PyPI are CPU/MPS already.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# B: bugbear, ASYNC: blocking calls in async code, C4: comprehensions.
# B008 is FastAPI's Depends()/Form() default-argument idiom.
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC", "C4"]
ignore = ["N999", "B008"]

[tool.ruff.lint.per-file-ignores]
# Routers are included at the bottom, after the core helpers they import.
"pipeline/api.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["tests/"]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
# pacod_id is annotated but ships no py.typed marker.
module = ["pacod_id", "pacod_id.*"]
follow_untyped_imports = true
