# pacod-kb on the shared network pacod-net: the app file. It holds kb's own services, the
# pipeline API and the UI; the shared components they use (pacod-postgres, pacod-db-init,
# pacod-qdrant, pacod-id, pacod-gw, pacod-mailpit) come from docker-compose.standalone.yml in kb's
# own stack, or from the full stack (pacod-demo), which loads this file and provides them once.
# The naming convention is in pacod-demo/docs/NETWORK.md.
#
#   make up      this file + docker-compose.standalone.yml, with the profiles in COMPOSE_PROFILES
#
# Both services always run (no profile). Every depends_on on a shared component carries
# required: false, so this file works whichever stack provides it.
#
# Secrets have no defaults here — `make setup` generates them into .env — and every service gets an
# explicit environment: the pipeline (which parses untrusted documents) never sees pacod-id's
# secrets, the UI never sees the gateway key.
#
# Data: KB_ROOT and KB_MODEL_CACHE are bind mounts of host directories (/data/... by default, as on
# a server). A value without a slash is a named volume instead (kb-data, kb-model-cache): macOS,
# where /data cannot be shared, and the full stack use those.

# Every service rotates its log (pacod-demo/docs/LOGGING.md, section 2); anchors do not cross
# files, so docker-compose.standalone.yml has its own copy.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  kb-pipeline:
    build:
      context: .
      args:
        # psycopg2 is always included (small) so switching to database mode never
        # needs a rebuild; set 0 only to slim a filesystem-only image.
        INSTALL_POSTGRES_EXTRA: ${INSTALL_POSTGRES_EXTRA:-1}
    image: kb-pipeline
    container_name: kb-pipeline
    logging: *logging
    restart: unless-stopped
    command: uvicorn pipeline.api:app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      # KB_DATA names the mount source when KB_ROOT must stay a path (local `uv run` reads .env).
      - ${KB_DATA:-${KB_ROOT:-/data/kb}}:/data/kb
      - ${KB_MODEL_CACHE:-/data/model-cache}:/model-cache
    networks:
      - pacod-net
    environment:
      - KB_ROOT=/data/kb
      - KB_DROPZONE=${KB_DROPZONE:-}
      - KB_DONE=${KB_DONE:-}
      - KB_FAILED=${KB_FAILED:-}
      - DROPZONE_INTERVAL_SECS=${DROPZONE_INTERVAL_SECS:-10}
      # The log (pacod-demo/docs/LOGGING.md): level debug|info|warn|error, format json|text.
      - SERVICE_NAME=kb-pipeline
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - GIT_AUTOCOMMIT=${GIT_AUTOCOMMIT:-false}
      - PIPELINE_API_SECRET=${PIPELINE_API_SECRET:-}
      # Vector store and embeddings
      - QDRANT_MODE=${QDRANT_MODE:-embedded}
      - QDRANT_URL=${QDRANT_URL:-http://pacod-qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-kb_chunks}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      # The shared embeddings service (pacod-embeddings, e.g. http://pacod-embeddings:8080):
      # blank = the model in this process. Only the tokenizer is loaded here then.
      - EMBEDDINGS_URL=${EMBEDDINGS_URL:-}
      - EMBEDDINGS_TIMEOUT_SECS=${EMBEDDINGS_TIMEOUT_SECS:-120}
      # Inference (docs/retrieval-eval.md): threads 0 = derived from the container's CPU quota
      - TORCH_NUM_THREADS=${TORCH_NUM_THREADS:-0}
      - EMBED_BATCH_TOKENS=${EMBED_BATCH_TOKENS:-1024}
      - QUERY_EMBED_CACHE_SIZE=${QUERY_EMBED_CACHE_SIZE:-256}
      - KEYWORD_QUERY_MODE=${KEYWORD_QUERY_MODE:-legacy}
      - RRF_KEYWORD_WEIGHT=${RRF_KEYWORD_WEIGHT:-1.0}
      - KEYWORD_PG_TIMEOUT_MS=${KEYWORD_PG_TIMEOUT_MS:-1500}
      # Second-stage reranker: off until measured on this CPU (docs/retrieval-eval.md).
      # bge-reranker-v2-m3 adds ~2.3 GB of RAM (fp32), gte-multilingual-reranker-base ~1.2 GB.
      # RERANKER_URL (the embeddings service's /rerank, bge-reranker-v2-m3) loads nothing here.
      - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
      - RERANKER_URL=${RERANKER_URL:-}
      - RERANKER_TIMEOUT_MS=${RERANKER_TIMEOUT_MS:-5000}
      - RERANKER_MODEL=${RERANKER_MODEL:-}
      - RERANKER_REVISION=${RERANKER_REVISION:-}
      - RERANKER_TRUST_REMOTE_CODE=${RERANKER_TRUST_REMOTE_CODE:-false}
      - RERANKER_CODE_REVISION=${RERANKER_CODE_REVISION:-}
      - RERANK_TOP_N=${RERANK_TOP_N:-10}
      - RERANK_MAX_LENGTH=${RERANK_MAX_LENGTH:-384}
      - RERANK_BATCH_SIZE=${RERANK_BATCH_SIZE:-16}
      - RERANK_GATE_TIMEOUT_MS=${RERANK_GATE_TIMEOUT_MS:-1000}
      - RETRIEVAL_CANDIDATE_K=${RETRIEVAL_CANDIDATE_K:-50}
      - INFERENCE_DEVICE=${INFERENCE_DEVICE:-auto}
      # 1 = never download models at runtime (the model cache must already hold them)
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-}
      # Ingest: queued jobs wait this long for a running scan; unchanged chunks keep vectors
      - JOB_LOCK_TIMEOUT_SECS=${JOB_LOCK_TIMEOUT_SECS:-3600}
      - EMBED_REUSE=${EMBED_REUSE:-true}
      - EMBED_REUSE_UNTAGGED=${EMBED_REUSE_UNTAGGED:-false}
      - REBUILD_REUSE_MAX_POINTS=${REBUILD_REUSE_MAX_POINTS:-100000}
      # Document store (database: the role and database kb on pacod-postgres, platform/postgres/kb-db.sh)
      - KB_STORAGE_BACKEND=${KB_STORAGE_BACKEND:-filesystem}
      - KB_DATABASE_HOST=${KB_DATABASE_HOST:-pacod-postgres}
      - KB_DATABASE_PORT=${KB_DATABASE_PORT:-5432}
      - KB_DATABASE_NAME=${KB_DATABASE_NAME:-kb}
      - KB_DATABASE_USER=${KB_DATABASE_USER:-kb}
      - KB_DATABASE_PASSWORD=${KB_DATABASE_PASSWORD:-}
      # Ingest checks
      - CONTENT_SECURITY_ENABLED=${CONTENT_SECURITY_ENABLED:-true}
      - CONTENT_SECURITY_WRAP_OUTPUT=${CONTENT_SECURITY_WRAP_OUTPUT:-true}
      - CONTENT_SECURITY_BLOCK_THRESHOLD=${CONTENT_SECURITY_BLOCK_THRESHOLD:-1.0}
      - CONTENT_SECURITY_QUARANTINE_THRESHOLD=${CONTENT_SECURITY_QUARANTINE_THRESHOLD:-0.5}
      - CONTENT_NOISE_FILTER_ENABLED=${CONTENT_NOISE_FILTER_ENABLED:-true}
      - LANGUAGE_VALIDATION_ENABLED=${LANGUAGE_VALIDATION_ENABLED:-true}
      - OCR_ENABLED=${OCR_ENABLED:-false}
      - OCR_CONFIDENCE_THRESHOLD=${OCR_CONFIDENCE_THRESHOLD:-0.95}
      # Confidence of an OCR page read by one engine only (no tesseract CLI in the image)
      - OCR_SINGLE_ENGINE_CONFIDENCE=${OCR_SINGLE_ENGINE_CONFIDENCE:-0.8}
      # accurate | fast: TableFormer mode for PDF tables (fast trades accuracy for speed)
      - DOCLING_TABLE_MODE=${DOCLING_TABLE_MODE:-accurate}
      # AI: every LLM call goes through the gateway (pacod-gw); a blank key = AI off.
      - PACOD_GW_URL=${PACOD_GW_URL:-http://pacod-gw:8080}
      - PACOD_GW_API_KEY=${PACOD_GW_API_KEY:-}
      - PACOD_GW_IDLE_TIMEOUT_SECS=${PACOD_GW_IDLE_TIMEOUT_SECS:-120}
      - LLM_CONVERTER_ENABLED=${LLM_CONVERTER_ENABLED:-true}
      - LLM_CONVERTER_MODEL=${LLM_CONVERTER_MODEL:-}
      - LLM_CONVERTER_PROVIDER=${LLM_CONVERTER_PROVIDER:-}
      - LLM_CONVERTER_MAX_TOKENS=${LLM_CONVERTER_MAX_TOKENS:-}
      - LLM_CONVERTER_TEMPERATURE=${LLM_CONVERTER_TEMPERATURE:-}
      - LLM_CONVERTER_TIMEOUT_SECS=${LLM_CONVERTER_TIMEOUT_SECS:-1800}
      - CONTENT_SECURITY_LLM_ENABLED=${CONTENT_SECURITY_LLM_ENABLED:-false}
      - CONTENT_SECURITY_LLM_MODEL=${CONTENT_SECURITY_LLM_MODEL:-}
      - CONTENT_SECURITY_LLM_TIMEOUT_SECS=${CONTENT_SECURITY_LLM_TIMEOUT_SECS:-15}
      # Fetch and parser limits
      - WEB_FETCH_ALLOW_PRIVATE=${WEB_FETCH_ALLOW_PRIVATE:-true}
      - ALLOW_INSECURE_TLS=${ALLOW_INSECURE_TLS:-true}
      - WEB_FETCH_MAX_BYTES=${WEB_FETCH_MAX_BYTES:-52428800}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-209715200}
      - PDF_MAX_PAGES=${PDF_MAX_PAGES:-2000}
      - PDF_MAX_BYTES=${PDF_MAX_BYTES:-209715200}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      pacod-qdrant:
        condition: service_healthy
        required: false
      # The role and database kb exist once pacod-db-init has run (it waits for pacod-postgres).
      pacod-db-init:
        condition: service_completed_successfully
        required: false
      # No pacod-embeddings here: kb's own stack has none, and compose refuses a dependency on a
      # service no loaded file defines. The full stack adds it where it sets EMBEDDINGS_URL.
      pacod-gw:
        condition: service_healthy
        required: false

  kb-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: kb-ui
    container_name: kb-ui
    logging: *logging
    restart: unless-stopped
    # The UI never reads KB_ROOT (it goes through the pipeline API), so the
    # archive is not mounted here.
    volumes:
      - kb-ui-data:/data/kb-ui
    networks:
      - pacod-net
    ports:
      # Loopback by default; a server behind a proxy, or a LAN install, sets UI_BIND. The full
      # stack publishes nothing (its edge, pacod-caddy, serves platform/caddy/kb.caddy).
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-8080}:8080"
    environment:
      - QDRANT_MODE=${QDRANT_MODE:-embedded}
      - QDRANT_URL=${QDRANT_URL:-http://pacod-qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      # The Qdrant pages show and touch only collections with this prefix (or a kb project's):
      # Qdrant may be shared with other products.
      - KB_QDRANT_COLLECTION_PREFIX=${KB_QDRANT_COLLECTION_PREFIX:-kb_}
      - PIPELINE_API_URL=${PIPELINE_API_URL:-http://kb-pipeline:8000}
      - PIPELINE_API_SECRET=${PIPELINE_API_SECRET:-}
      - UI_SESSION_SECRET=${UI_SESSION_SECRET:-}
      - UI_SESSION_HTTPS_ONLY=${UI_SESSION_HTTPS_ONLY:-false}
      - UI_SESSION_MAX_AGE_SECS=${UI_SESSION_MAX_AGE_SECS:-43200}
      - UI_DB_PATH=${UI_DB_PATH:-/data/kb-ui/users.db}
      # Proxies whose X-Forwarded-* the UI believes (behind pacod-caddy: its address, or *)
      - FORWARDED_ALLOW_IPS=${UI_FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Sign-in: pacod-id. The browser goes to the issuer; the UI calls the internal listener.
      # KB_UI_ORIGIN is the UI's address as browsers use it.
      - KB_UI_ORIGIN=${KB_UI_ORIGIN:-http://localhost:8080}
      - PACOD_ID_ISSUER=${KB_ID_ISSUER:-http://127.0.0.1:18070}
      - PACOD_ID_INTERNAL_URL=${PACOD_ID_INTERNAL_URL:-http://pacod-id:8071}
      - PACOD_ID_UI_CLIENT_ID=pacod-kb-ui
      - PACOD_ID_UI_SECRET=${KB_ID_UI_SECRET:-}
      - PACOD_ID_SERVICE_CLIENT_ID=pacod-kb-service
      - PACOD_ID_SERVICE_SECRET=${KB_ID_SERVICE_SECRET:-}
      - SERVICE_NAME=kb-ui
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    depends_on:
      kb-pipeline:
        condition: service_healthy
        required: false
      pacod-id:
        condition: service_healthy
        required: false

volumes:
  kb-ui-data:
  # Used only when KB_DATA / KB_ROOT or KB_MODEL_CACHE name them instead of a host directory.
  kb-data:
  kb-model-cache:

networks:
  pacod-net:
    external: true
