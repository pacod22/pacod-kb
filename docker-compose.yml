# pacod-kb: the pipeline API, the UI, Qdrant and PostgreSQL, plus — for a development or
# self-contained install — pacod-id (sign-in) and a development AI gateway.
#
# Which services run is COMPOSE_PROFILES (in .env; `make up` infers it when unset):
#   pipeline, ui         kb itself
#   server, db           bundled Qdrant and PostgreSQL
#   id, mailpit          bundled pacod-id with its PostgreSQL, and a mail catcher for its mails
#   dev-gateway          pacod-gw-lite in front of pacod-gw's mock providers (nothing leaves the machine)
#
# Secrets have no defaults here — `make setup` generates them into .env — and every service gets an
# explicit environment: the pipeline (which parses untrusted documents) never sees pacod-id's
# secrets, the UI never sees the gateway key.
#
# Networks: agent-net (external) joins kb to other agents; kb-id carries the UI's calls to pacod-id,
# kb-ai the pipeline's calls to the gateway. The pipeline shares no network with pacod-id.

services:
  pipeline:
    build:
      context: .
      args:
        # psycopg2 is always included (small) so switching to database mode never
        # needs a rebuild; set 0 only to slim a filesystem-only image.
        INSTALL_POSTGRES_EXTRA: ${INSTALL_POSTGRES_EXTRA:-1}
    image: kb-pipeline
    container_name: kb-pipeline
    restart: unless-stopped
    command: uvicorn pipeline.api:app --host 0.0.0.0 --port 8000 --workers 1
    volumes:
      - ${KB_ROOT:-/data/kb}:/data/kb
      - /data/model-cache:/model-cache
    networks:
      - agent-net
      - kb-ai
    environment:
      - KB_ROOT=/data/kb
      - KB_DROPZONE=${KB_DROPZONE:-}
      - KB_DONE=${KB_DONE:-}
      - KB_FAILED=${KB_FAILED:-}
      - DROPZONE_INTERVAL_SECS=${DROPZONE_INTERVAL_SECS:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GIT_AUTOCOMMIT=${GIT_AUTOCOMMIT:-false}
      - PIPELINE_API_SECRET=${PIPELINE_API_SECRET:-}
      # Vector store and embeddings
      - QDRANT_MODE=${QDRANT_MODE:-embedded}
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-kb_chunks}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
      # Inference (docs/retrieval-eval.md): threads 0 = derived from the container's CPU quota
      - TORCH_NUM_THREADS=${TORCH_NUM_THREADS:-0}
      - EMBED_BATCH_TOKENS=${EMBED_BATCH_TOKENS:-1024}
      - QUERY_EMBED_CACHE_SIZE=${QUERY_EMBED_CACHE_SIZE:-256}
      - KEYWORD_QUERY_MODE=${KEYWORD_QUERY_MODE:-legacy}
      - RRF_KEYWORD_WEIGHT=${RRF_KEYWORD_WEIGHT:-1.0}
      - KEYWORD_PG_TIMEOUT_MS=${KEYWORD_PG_TIMEOUT_MS:-1500}
      # Second-stage reranker: off until measured on this CPU (docs/retrieval-eval.md).
      # bge-reranker-v2-m3 adds ~2.3 GB of RAM (fp32), gte-multilingual-reranker-base ~1.2 GB.
      - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
      - RERANKER_MODEL=${RERANKER_MODEL:-}
      - RERANKER_REVISION=${RERANKER_REVISION:-}
      - RERANKER_TRUST_REMOTE_CODE=${RERANKER_TRUST_REMOTE_CODE:-false}
      - RERANKER_CODE_REVISION=${RERANKER_CODE_REVISION:-}
      - RERANK_TOP_N=${RERANK_TOP_N:-10}
      - RERANK_MAX_LENGTH=${RERANK_MAX_LENGTH:-384}
      - RERANK_BATCH_SIZE=${RERANK_BATCH_SIZE:-16}
      - RERANK_GATE_TIMEOUT_MS=${RERANK_GATE_TIMEOUT_MS:-1000}
      - RETRIEVAL_CANDIDATE_K=${RETRIEVAL_CANDIDATE_K:-50}
      - INFERENCE_DEVICE=${INFERENCE_DEVICE:-auto}
      # 1 = never download models at runtime (the model cache must already hold them)
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-}
      # Ingest: queued jobs wait this long for a running scan; unchanged chunks keep vectors
      - JOB_LOCK_TIMEOUT_SECS=${JOB_LOCK_TIMEOUT_SECS:-3600}
      - EMBED_REUSE=${EMBED_REUSE:-true}
      - EMBED_REUSE_UNTAGGED=${EMBED_REUSE_UNTAGGED:-false}
      - REBUILD_REUSE_MAX_POINTS=${REBUILD_REUSE_MAX_POINTS:-100000}
      # Document store
      - KB_STORAGE_BACKEND=${KB_STORAGE_BACKEND:-filesystem}
      - KB_DATABASE_HOST=${KB_DATABASE_HOST:-}
      - KB_DATABASE_PORT=${KB_DATABASE_PORT:-5432}
      - KB_DATABASE_NAME=${KB_DATABASE_NAME:-kb}
      - KB_DATABASE_USER=${KB_DATABASE_USER:-}
      - KB_DATABASE_PASSWORD=${KB_DATABASE_PASSWORD:-}
      # Ingest checks
      - CONTENT_SECURITY_ENABLED=${CONTENT_SECURITY_ENABLED:-true}
      - CONTENT_SECURITY_WRAP_OUTPUT=${CONTENT_SECURITY_WRAP_OUTPUT:-true}
      - CONTENT_SECURITY_BLOCK_THRESHOLD=${CONTENT_SECURITY_BLOCK_THRESHOLD:-1.0}
      - CONTENT_SECURITY_QUARANTINE_THRESHOLD=${CONTENT_SECURITY_QUARANTINE_THRESHOLD:-0.5}
      - CONTENT_NOISE_FILTER_ENABLED=${CONTENT_NOISE_FILTER_ENABLED:-true}
      - LANGUAGE_VALIDATION_ENABLED=${LANGUAGE_VALIDATION_ENABLED:-true}
      - OCR_ENABLED=${OCR_ENABLED:-false}
      - OCR_CONFIDENCE_THRESHOLD=${OCR_CONFIDENCE_THRESHOLD:-0.95}
      # Confidence of an OCR page read by one engine only (no tesseract CLI in the image)
      - OCR_SINGLE_ENGINE_CONFIDENCE=${OCR_SINGLE_ENGINE_CONFIDENCE:-0.8}
      # accurate | fast: TableFormer mode for PDF tables (fast trades accuracy for speed)
      - DOCLING_TABLE_MODE=${DOCLING_TABLE_MODE:-accurate}
      # AI: every LLM call goes through the gateway (pacod-gw); blank URL or key = AI off.
      - PACOD_GW_URL=${PACOD_GW_URL:-}
      - PACOD_GW_API_KEY=${PACOD_GW_API_KEY:-}
      - PACOD_GW_IDLE_TIMEOUT_SECS=${PACOD_GW_IDLE_TIMEOUT_SECS:-120}
      - LLM_CONVERTER_ENABLED=${LLM_CONVERTER_ENABLED:-true}
      - LLM_CONVERTER_MODEL=${LLM_CONVERTER_MODEL:-}
      - LLM_CONVERTER_PROVIDER=${LLM_CONVERTER_PROVIDER:-}
      - LLM_CONVERTER_MAX_TOKENS=${LLM_CONVERTER_MAX_TOKENS:-}
      - LLM_CONVERTER_TEMPERATURE=${LLM_CONVERTER_TEMPERATURE:-}
      - LLM_CONVERTER_TIMEOUT_SECS=${LLM_CONVERTER_TIMEOUT_SECS:-1800}
      - CONTENT_SECURITY_LLM_ENABLED=${CONTENT_SECURITY_LLM_ENABLED:-false}
      - CONTENT_SECURITY_LLM_MODEL=${CONTENT_SECURITY_LLM_MODEL:-}
      - CONTENT_SECURITY_LLM_TIMEOUT_SECS=${CONTENT_SECURITY_LLM_TIMEOUT_SECS:-15}
      # Fetch and parser limits
      - WEB_FETCH_ALLOW_PRIVATE=${WEB_FETCH_ALLOW_PRIVATE:-true}
      - ALLOW_INSECURE_TLS=${ALLOW_INSECURE_TLS:-true}
      - WEB_FETCH_MAX_BYTES=${WEB_FETCH_MAX_BYTES:-52428800}
      - UPLOAD_MAX_BYTES=${UPLOAD_MAX_BYTES:-209715200}
      - PDF_MAX_PAGES=${PDF_MAX_PAGES:-2000}
      - PDF_MAX_BYTES=${PDF_MAX_BYTES:-209715200}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      gw:
        condition: service_healthy
        required: false
    profiles:
      - pipeline

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: kb-ui
    container_name: kb-ui
    restart: unless-stopped
    # The UI never reads KB_ROOT (it goes through the pipeline API), so the
    # archive is not mounted here.
    volumes:
      - kb_ui_data:/data/kb-ui
    networks:
      - agent-net
      - kb-id
    ports:
      # Loopback by default; a server behind a proxy, or a LAN install, sets UI_BIND.
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-8080}:8080"
    environment:
      - QDRANT_MODE=${QDRANT_MODE:-embedded}
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - PIPELINE_API_URL=${PIPELINE_API_URL:-http://kb-pipeline:8000}
      - PIPELINE_API_SECRET=${PIPELINE_API_SECRET:-}
      - UI_SESSION_SECRET=${UI_SESSION_SECRET:-}
      - UI_SESSION_HTTPS_ONLY=${UI_SESSION_HTTPS_ONLY:-false}
      - UI_SESSION_MAX_AGE_SECS=${UI_SESSION_MAX_AGE_SECS:-43200}
      - UI_DB_PATH=${UI_DB_PATH:-/data/kb-ui/users.db}
      - FORWARDED_ALLOW_IPS=${UI_FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Sign-in: pacod-id (the bundled one by default). The browser goes to the issuer; the UI
      # calls the internal listener. KB_UI_ORIGIN is the UI's address as browsers use it.
      - KB_UI_ORIGIN=${KB_UI_ORIGIN:-http://localhost:8080}
      - PACOD_ID_ISSUER=${KB_ID_ISSUER:-http://127.0.0.1:18070}
      - PACOD_ID_INTERNAL_URL=${PACOD_ID_INTERNAL_URL:-http://id:8071}
      - PACOD_ID_UI_CLIENT_ID=pacod-kb-ui
      - PACOD_ID_UI_SECRET=${KB_ID_UI_SECRET:-}
      - PACOD_ID_SERVICE_CLIENT_ID=pacod-kb-service
      - PACOD_ID_SERVICE_SECRET=${KB_ID_SERVICE_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      pipeline:
        condition: service_healthy
        required: false
      id:
        condition: service_healthy
        required: false
    profiles:
      - ui

  qdrant:
    # Pin QDRANT_IMAGE_TAG to the version you run: Qdrant storage cannot be
    # opened by an older server, so an unpinned "latest" pull is one-way.
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG:-latest}
    container_name: kb-qdrant
    profiles:
      - server
    volumes:
      - /data/qdrant/storage:/qdrant/storage
    # Loopback only: other containers reach Qdrant over agent-net.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - agent-net

  postgres:
    image: postgres:16-alpine
    container_name: kb-postgres
    profiles:
      - db
    environment:
      - POSTGRES_DB=${KB_DATABASE_NAME:-kb}
      - POSTGRES_USER=${KB_DATABASE_USER:-kb}
      - POSTGRES_PASSWORD=${KB_DATABASE_PASSWORD:-kb}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KB_DATABASE_USER:-kb} -d ${KB_DATABASE_NAME:-kb}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - agent-net

  # ---- sign-in: pacod-id, its PostgreSQL, and a mail catcher (profiles id, mailpit) -------------
  #
  # pacod-id owns accounts, sessions and role bindings; the UI signs people in through it (OIDC)
  # and reads their kb roles from its feed. Profile-gated services use :- defaults, never :?
  # (compose would demand them with the profile off); `make check-env` checks what is needed.

  id-postgres:
    image: postgres:18.6-alpine3.24
    container_name: kb-id-postgres
    profiles: [id]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PID_PG_SUPERUSER_PASSWORD:-}
      PID_DB_PASSWORD: ${PID_DB_PASSWORD:-}
    volumes:
      - kb-id-pg-data:/var/lib/postgresql
      - ./docker/pacod-id/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - kb-id
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "pacod_id"]
      interval: 2s
      timeout: 3s
      retries: 30

  id:
    # Built from pacod-id's own sources by `make images` (only when missing): a Rust build, slow the
    # first time. Not pacod-id:dev: pacod-gw builds that tag from its vendored copy, without the kb
    # brand.
    image: ${PACOD_ID_IMAGE:-pacod-kb-id:dev}
    container_name: kb-id
    profiles: [id]
    restart: unless-stopped
    depends_on:
      id-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
        required: false
    environment:
      PID_DATABASE_URL: postgres://pacod_id:${PID_DB_PASSWORD:-}@id-postgres:5432/pacod_id
      PID_KEK: ${PID_KEK:-}
      PID_TOKEN_PEPPER: ${PID_TOKEN_PEPPER:-}
      KB_ID_UI_SECRET: ${KB_ID_UI_SECRET:-}
      KB_ID_SERVICE_SECRET: ${KB_ID_SERVICE_SECRET:-}
      # The issuer is the address browsers use, and pacod-id answers its sign-in pages only on that
      # exact host and port. Development: the published loopback port below.
      KB_ID_ISSUER: ${KB_ID_ISSUER:-http://127.0.0.1:18070}
      KB_UI_ORIGIN: ${KB_UI_ORIGIN:-http://localhost:8080}
      # Behind a proxy (production), name it so sign-in throttling sees people's addresses.
      PID_TRUSTED_PROXIES: ${PID_TRUSTED_PROXIES:-}
      # The first account, created once: an identity admin and kb admin.
      PID_BOOTSTRAP_ADMIN_EMAIL: ${ID_ADMIN_EMAIL:-admin@pacod-kb.test}
      PID_BOOTSTRAP_ADMIN_PASSWORD: ${ID_ADMIN_PASSWORD:-}
      PID_BOOTSTRAP_ADMIN_REALM: kb
      PID_BOOTSTRAP_ADMIN_ROLES: id.admin,kb.admin
      # Mail: mailpit unless PID_SMTP_HOST names a relay (production must). TLS: starttls, tls or none.
      PID_SMTP_HOST: ${PID_SMTP_HOST:-mailpit}
      PID_SMTP_PORT: ${PID_SMTP_PORT:-1025}
      PID_SMTP_TLS: ${PID_SMTP_TLS:-none}
      PID_SMTP_USERNAME: ${PID_SMTP_USERNAME:-}
      PID_SMTP_PASSWORD: ${PID_SMTP_PASSWORD:-}
      PID_EMAIL_FROM_ADDRESS: ${ID_MAIL_FROM:-id@pacod-kb.test}
      PID_EMAIL_FROM_NAME: pacod-kb
      PID_LOG_FORMAT: text
    volumes:
      - ./docker/pacod-id/pacod-id.toml:/etc/pacod-id/pacod-id.toml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    ports:
      # The public listener (sign-in pages, authorize, logout). The internal listener (8071) and
      # metrics (9170) stay inside kb-id.
      - "127.0.0.1:${KB_ID_PORT:-18070}:8070"
    networks:
      - kb-id
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9170/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Every mail pacod-id sends (invitations, resets) ends here; none leaves the machine.
  # Its page: http://127.0.0.1:${KB_MAILPIT_PORT:-18025}/
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: kb-mailpit
    profiles: [mailpit]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KB_MAILPIT_PORT:-18025}:8025"
    networks:
      - kb-id

  # ---- AI: the development gateway (profile dev-gateway) -------------------------------------
  #
  # pacod-gw-lite in front of pacod-gw's mock providers: a chat answer is an echo of the last user
  # message, a JSON-schema answer an instance of the schema, and nothing leaves the machine. The
  # pipeline reaches it at http://gw:8080 with the key `make setup` wrote (PACOD_GW_API_KEY). Its
  # models carry kb's default names, so the defaults work unchanged. A deployment drops the profile
  # and points PACOD_GW_URL/PACOD_GW_API_KEY at a real gateway. Images: `make images`.
  gw:
    image: ${PACOD_GW_LITE_IMAGE:-pacod-gw-lite:dev}
    container_name: kb-gw
    profiles: [dev-gateway]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["serve"]
    environment:
      PGW_LISTEN: 0.0.0.0:8080
      PGW_LOG_FORMAT: text
      PGW_EGRESS_ALLOW_PRIVATE: gw-mock
      PGW_MAX_BODY_BYTES: "33554432"
      PGW_PROVIDER_ANTHROPIC_KEY: dev-anthropic-key
      PGW_PROVIDER_ANTHROPIC_BASE_URL: http://gw-mock:9000
      PGW_PROVIDER_OPENAI_KEY: dev-openai-key
      PGW_PROVIDER_OPENAI_BASE_URL: http://gw-mock:9000/v1
      PGW_MODEL_OPUS: anthropic/claude-opus-5-5
      PGW_MODEL_OPUS_PRICE: input=5,output=25
      PGW_MODEL_HAIKU: anthropic/claude-haiku-4-5
      PGW_MODEL_HAIKU_PRICE: input=1,output=5
      PGW_MODEL_GPT: openai/gpt-dev
      PGW_MODEL_GPT_PRICE: input=1.25,output=10
      PGW_CLIENT_KB_KEY: ${PACOD_GW_API_KEY:-}
    depends_on:
      gw-mock:
        condition: service_healthy
    networks:
      - kb-ai
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  gw-mock:
    image: ${PACOD_GW_MOCK_IMAGE:-pacod-gw-mock:dev}
    container_name: kb-gw-mock
    profiles: [dev-gateway]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - kb-ai

volumes:
  kb_ui_data:
  kb-id-pg-data:

networks:
  agent-net:
    name: agent-net
    external: true
  # Plain bridges: an internal network could neither publish ports nor reach a provider.
  kb-id: {}
  kb-ai: {}
